name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" --no-deps -q || true
          pip install pytest pyyaml -q

      - name: Lint
        run: |
          pip install ruff -q
          ruff check src tests || true

      - name: Run offline unit tests
        run: pytest tests/ -v

  # Placeholder — extended in Phase 5 with:
  #   - docker build validation
  #   - kind/minikube manifest lint (kubeval / kubeconform)
  #   - deploy step
